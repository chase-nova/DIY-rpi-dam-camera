name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  links:
    # every link and image in the guide must resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --include-fragments README.md README.ko.md TERMS.md TERMS.ko.md CONTRIBUTING.md
          fail: true

  image-size:
    # keep the guide fast: photos are web-sized JPEG/PNG under 1 MB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          big=$(find images -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' \) -size +1024k)
          if [ -n "$big" ]; then echo "::error::images over 1 MB:"; echo "$big"; exit 1; fi
          echo "all images under 1 MB"

  privacy-guard:
    # Blocks private identifiers from ever landing here. The pattern lives
    # in the DENYLIST repository secret (it would defeat itself if
    # committed); without it (e.g. pull requests from forks) it is skipped.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: denylist
        env:
          DENYLIST: ${{ secrets.DENYLIST }}
        run: |
          if [ -z "$DENYLIST" ]; then
            echo "DENYLIST secret not available - skipped"
            exit 0
          fi
          files=$(grep -rIlEi "$DENYLIST" --exclude-dir=.git . || true)
          if [ -n "$files" ]; then
            echo "private identifiers found in:"
            echo "$files"
            exit 1
          fi
          echo "clean"
